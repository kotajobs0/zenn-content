name: Daily Content Generation

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # ここで確実にライブラリをインストールさせます
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-dotenv

      - name: Generate content
        env:
          # Secretsの名前が GOOGLE_API_KEY であることを確認してください
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          # 実行時はリポジトリのルートを基準に呼び出すので、この書き方でOKです
          python articles/process/daily_article.py
          python articles/process/wiki_generator.py

      - name: Copy files to Zenn articles folder
        run: |
          # 2>/dev/null || true を付けることで、ファイルがない場合のエラー停止を防ぎます
          cp articles/data/logs/*.md articles/ 2>/dev/null || true
          # Wiki/Ref用（もしフォルダ名が wiki だった場合も考慮）
          cp articles/data/refs/*.md articles/ 2>/dev/null || true
          cp articles/data/wiki/*.md articles/ 2>/dev/null || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: AI生成記事をZenn下書きへ反映"
          title: "【自動生成】新しい記事の下書き"
          body: "AIが生成した記事をコピーしました。内容を確認してください。"
          branch: "auto-generated-content"
          delete-branch: true